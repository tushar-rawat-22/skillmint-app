name: Product feedback
description: Share a concrete point of confusion, friction, or missing clarity from using SkillMint
title: "[Feedback]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Product feedback is most useful when it describes a real task and where SkillMint became unclear or blocked. Do not include names, email addresses, resume text, job-description text, passwords, authentication details, or private screenshots.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: stall
    attributes:
      label: Where did you become uncertain or blocked?
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: What did you expect SkillMint to make clearer?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Access / setup
        - Resume upload or understanding
        - Resume comparison
        - Job match / target role
        - Roadmap / next steps
        - Proof Brief / recruiter evidence
        - Privacy / trust explanation
        - Accessibility
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, resume, account and authentication information from this report.
          required: true
