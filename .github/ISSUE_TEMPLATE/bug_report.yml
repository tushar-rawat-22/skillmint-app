name: Bug report
description: Report a reproducible SkillMint product or accessibility defect
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SkillMint. Do not include names, email addresses, resume text, job-description text, passwords, authentication details, or private screenshots. Use synthetic examples.
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What were you trying to do?
      placeholder: e.g. Compare two resume versions for a target role
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: e.g. Safari 18 on iPhone 15, or Chrome 140 on macOS
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, resume, account and authentication information from this report.
          required: true
