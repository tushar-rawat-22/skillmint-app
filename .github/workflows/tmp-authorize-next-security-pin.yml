name: Temporary authorize Next security pin

on:
  push:
    branches:
      - security/next-16-3-3

permissions:
  contents: write

jobs:
  update-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authorize only the reviewed framework pin
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          fixture = Path('scripts/resume-workspace-phase-1a-fixtures.mjs')
          lines = fixture.read_text().splitlines()

          marker_index = next(
              i for i, line in enumerate(lines)
              if 'package metadata permits only authorized fixture scripts' in line
          )
          assertion_index = next(
              i for i, line in enumerate(lines[marker_index + 1:], marker_index + 1)
              if 'assert.deepEqual(currentWithoutScripts, baselineWithoutScripts);' in line
          )
          indent = lines[assertion_index][:len(lines[assertion_index]) - len(lines[assertion_index].lstrip())]
          replacement = [
              indent + 'assert.equal(currentWithoutScripts.dependencies.next, "16.3.3");',
              indent + 'assert.equal(',
              indent + '  currentWithoutScripts.devDependencies["eslint-config-next"],',
              indent + '  "16.3.3",',
              indent + ');',
              indent + 'const normalizedCurrentWithoutScripts = structuredClone(currentWithoutScripts);',
              indent + 'normalizedCurrentWithoutScripts.dependencies.next = baselineWithoutScripts.dependencies.next;',
              indent + 'normalizedCurrentWithoutScripts.devDependencies["eslint-config-next"] =',
              indent + '  baselineWithoutScripts.devDependencies["eslint-config-next"];',
              indent + 'assert.deepEqual(normalizedCurrentWithoutScripts, baselineWithoutScripts);',
          ]
          lines[assertion_index:assertion_index + 1] = replacement

          lock_hash = hashlib.sha256(Path('package-lock.json').read_bytes()).hexdigest()
          hash_index = next(i for i, line in enumerate(lines) if 'const SECURITY_PACKAGE_LOCK_SHA256' in line)
          if hash_index + 1 >= len(lines):
              raise SystemExit('security lock hash line missing')
          hash_indent = lines[hash_index + 1][:len(lines[hash_index + 1]) - len(lines[hash_index + 1].lstrip())]
          lines[hash_index + 1] = hash_indent + '"' + lock_hash + '";'

          fixture.write_text('\n'.join(lines) + '\n')
          print('authorized lock sha256:', lock_hash)
          PY
      - name: Verify focused frozen-contract fixture
        run: |
          npm ci
          npm run fixtures:resume-workspace-phase-1a
      - name: Commit fixture repair and remove helper
        run: |
          rm .github/workflows/tmp-authorize-next-security-pin.yml .github/tmp-next-security-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/resume-workspace-phase-1a-fixtures.mjs .github/workflows/tmp-authorize-next-security-pin.yml .github/tmp-next-security-trigger.txt
          git commit -m "test: authorize reviewed Next security pin"
          git push origin HEAD:security/next-16-3-3
