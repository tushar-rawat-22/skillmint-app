name: Temporary authorize Next security pin

on:
  push:
    branches:
      - security/next-16-3-3

permissions:
  contents: write

jobs:
  update-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair exact frozen-package authorization
        run: |
          python - <<'PY'
          from pathlib import Path

          fixture = Path('scripts/resume-workspace-phase-1a-fixtures.mjs')
          text = fixture.read_text()
          old = '''  assert.equal(currentWithoutScripts.dependencies.next, "16.3.3");
          assert.equal(
            currentWithoutScripts.devDependencies["eslint-config-next"],
            "16.3.3",
          );
          currentWithoutScripts.dependencies.next = baselineWithoutScripts.dependencies.next;
          currentWithoutScripts.devDependencies["eslint-config-next"] =
            baselineWithoutScripts.devDependencies["eslint-config-next"];
          assert.deepEqual(currentWithoutScripts, baselineWithoutScripts);'''
          new = '''  assert.equal(currentPackage.dependencies.next, "16.3.3");
          assert.equal(currentPackage.devDependencies["eslint-config-next"], "16.3.3");
          const normalizedCurrentWithoutScripts = structuredClone(currentWithoutScripts);
          normalizedCurrentWithoutScripts.dependencies.next =
            baselineWithoutScripts.dependencies.next;
          normalizedCurrentWithoutScripts.devDependencies["eslint-config-next"] =
            baselineWithoutScripts.devDependencies["eslint-config-next"];
          assert.deepEqual(normalizedCurrentWithoutScripts, baselineWithoutScripts);'''
          if text.count(old) != 1:
              raise SystemExit('expected reviewed package authorization block not found exactly once')
          fixture.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused frozen-contract fixture
        run: |
          npm ci
          npm run fixtures:resume-workspace-phase-1a
          npm audit --audit-level=high
      - name: Commit verified repair and remove temporary helper
        run: |
          rm .github/workflows/tmp-authorize-next-security-pin.yml .github/tmp-next-security-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/resume-workspace-phase-1a-fixtures.mjs .github/workflows/tmp-authorize-next-security-pin.yml .github/tmp-next-security-trigger.txt
          git commit -m "test: authorize reviewed Next security pin"
          git push origin HEAD:security/next-16-3-3
