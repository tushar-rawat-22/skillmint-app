name: Cloud lock refresh

on:
  push:
    branches:
      - fix/sharp-0.35.4
    paths:
      - .github/workflows/cloud-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify audit at release threshold
        run: npm audit --audit-level=high

      - name: Record lockfile hash
        run: sha256sum package-lock.json | cut -d ' ' -f1 > lock-sha256.txt

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json lock-sha256.txt
          git commit -m "Regenerate audited dependency lockfile"
          git push origin HEAD:fix/sharp-0.35.4
