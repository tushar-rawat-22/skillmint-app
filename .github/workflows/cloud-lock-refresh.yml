name: Cloud lock refresh

on:
  push:
    branches:
      - fix/sharp-0.35.4
    paths:
      - .github/workflows/cloud-lock-refresh.yml

permissions:
  contents: write

jobs:
  diagnose-full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Verify audit
        run: npm audit --audit-level=high

      - name: Capture full-history fixture result
        shell: bash
        run: |
          set +e
          npm run fixtures:resume-workspace-phase-1a > fixture-output.txt 2>&1
          echo "$?" > fixture-exit-code.txt
          exit 0

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixture-output.txt fixture-exit-code.txt
          git commit -m "Capture full-history fixture rejection"
          git push origin HEAD:fix/sharp-0.35.4
