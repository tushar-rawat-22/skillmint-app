name: Cloud lock refresh

on:
  push:
    branches:
      - fix/sharp-0.35.4
    paths:
      - .github/workflows/cloud-lock-refresh.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Verify audit
        run: npm audit --audit-level=high

      - name: Verify frozen dependency fixture
        run: npm run fixtures:resume-workspace-phase-1a

      - name: Remove temporary cloud files
        run: rm -f audit-report.json audit-exit-code.txt lock-sha256.txt fixture-output.txt fixture-exit-code.txt .github/workflows/cloud-lock-refresh.yml

      - name: Commit final reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize dependency security remediation"
          git push origin HEAD:fix/sharp-0.35.4
