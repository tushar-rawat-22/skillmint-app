name: Cloud lock refresh

on:
  push:
    branches:
      - fix/sharp-0.35.4
    paths:
      - .github/workflows/cloud-lock-refresh.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Tighten authorized security override fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/resume-workspace-phase-1a-fixtures.mjs')
          text = path.read_text()
          old = '''  assert.equal(currentPackage.dependencies.next, "16.3.3");
assert.equal(currentPackage.devDependencies["eslint-config-next"], "16.3.3");
const normalizedCurrentWithoutScripts = structuredClone(currentWithoutScripts);
normalizedCurrentWithoutScripts.dependencies.next =
  baselineWithoutScripts.dependencies.next;
normalizedCurrentWithoutScripts.devDependencies["eslint-config-next"] =
  baselineWithoutScripts.devDependencies["eslint-config-next"];
assert.deepEqual(normalizedCurrentWithoutScripts, baselineWithoutScripts);'''
          new = '''  assert.equal(currentPackage.dependencies.next, "16.3.3");
assert.equal(currentPackage.devDependencies["eslint-config-next"], "16.3.3");
assert.equal(currentPackage.overrides["js-yaml"], "4.3.2");
assert.equal(currentPackage.overrides.next.sharp, "0.35.4");
const normalizedCurrentWithoutScripts = structuredClone(currentWithoutScripts);
normalizedCurrentWithoutScripts.dependencies.next =
  baselineWithoutScripts.dependencies.next;
normalizedCurrentWithoutScripts.devDependencies["eslint-config-next"] =
  baselineWithoutScripts.devDependencies["eslint-config-next"];
delete normalizedCurrentWithoutScripts.overrides["js-yaml"];
normalizedCurrentWithoutScripts.overrides.next.sharp =
  baselineWithoutScripts.overrides.next.sharp;
assert.deepEqual(normalizedCurrentWithoutScripts, baselineWithoutScripts);'''
          if old not in text:
              raise SystemExit('authorized package normalization block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify audit
        run: npm audit --audit-level=high

      - name: Verify frozen dependency fixture
        run: npm run fixtures:resume-workspace-phase-1a

      - name: Remove temporary cloud files
        run: rm -f audit-report.json audit-exit-code.txt lock-sha256.txt fixture-output.txt fixture-exit-code.txt .github/workflows/cloud-lock-refresh.yml

      - name: Commit final reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize dependency security remediation"
          git push origin HEAD:fix/sharp-0.35.4
