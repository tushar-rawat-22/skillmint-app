name: Lock refresh diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lock:
    if: github.head_ref == 'security/refresh-browserslist-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.13.0
      - name: Refresh vulnerable lock entries only
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm audit --audit-level=high
      - name: Upload refreshed lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
