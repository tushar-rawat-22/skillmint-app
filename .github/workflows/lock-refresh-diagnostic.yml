name: Lock refresh diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.head_ref == 'security/refresh-browserslist-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.13.0
      - name: Refresh vulnerable lock entries only
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm audit --audit-level=high
      - name: Commit generated lock only
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh browserslist audit lock"
          git push origin HEAD:security/refresh-browserslist-audit
