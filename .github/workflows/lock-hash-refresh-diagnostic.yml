name: Lock hash refresh diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock-hash:
    if: github.head_ref == 'security/refresh-browserslist-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.13.0
      - name: Verify audited lock and refresh exact frozen hash
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          actual="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$actual" = "19f18b978f66921719f580821931f7e466cbea3ba3a5db553a361feb25ed9dd7"
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/resume-workspace-phase-1a-fixtures.mjs')
          text = path.read_text()
          old = '4e20c5c5db9198a8a00efbaba9d56f10cd7835ac652d3f3493a1d85b98f264a8'
          new = '19f18b978f66921719f580821931f7e466cbea3ba3a5db553a361feb25ed9dd7'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale security lock hash')
          path.write_text(text.replace(old, new))
          PY
          npm run fixtures:resume-workspace-phase-1a
      - name: Commit reviewed hash refresh only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/resume-workspace-phase-1a-fixtures.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "scripts/resume-workspace-phase-1a-fixtures.mjs"
          git commit -m "Refresh audited package lock fixture hash"
          git push origin HEAD:security/refresh-browserslist-audit
