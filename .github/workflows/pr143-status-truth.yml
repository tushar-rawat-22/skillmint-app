name: PR143 status truth reconciliation

on:
  push:
    branches:
      - product/candidate-job-lifecycle-foundation
    paths:
      - ".github/workflows/pr143-status-truth.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: product/candidate-job-lifecycle-foundation
          fetch-depth: 0

      - name: Add current Production migration truth to current status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text()
          anchor = "This is the current-state entry point for the founder and maintainers. Before planning new work, fetch the current `main` branch and confirm its HEAD; this SHA records the implementation baseline audited for this document, not a promise that it will remain current.\n"
          insertion = "\n**Current Production migration truth (September 12, 2026):** Production migration history from V1 through V13 is verified on `skillmint-beta`. V14 is pending Production execution and remains unapplied; PR #143 is review/rehearsal work only. SkillMint is launched with controlled account admission.\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one status anchor, found {text.count(anchor)}')
          if 'Production migration history from V1 through V13 is verified' in text:
              raise SystemExit('current migration truth already present')
          path.write_text(text.replace(anchor, anchor + insertion, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify current rollout documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/block6-rollout-foundation-fixtures.mjs
          node scripts/production-rollout-foundation-fixtures.mjs
          git diff --check

      - name: Commit bounded current-status correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SkillMint Unified Autopilot"
          git config user.email "151115438+tushar-rawat-22@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          git diff --cached --check
          git commit -m "Record current Production migration truth"
          git push origin HEAD:product/candidate-job-lifecycle-foundation
