name: vinext compatibility proof

on:
  push:
    branches:
      - chore/issue-97-vinext-compat-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run pinned vinext compatibility check
        run: npx --yes vinext@1.0.0-beta.8 check
      - name: Build production bundle with pinned vinext
        id: vinext-build
        shell: bash
        run: |
          set +e
          npx --yes vinext@1.0.0-beta.8 build 2>&1 | tee vinext-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload vinext build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinext-build-log
          path: vinext-build.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce vinext build result
        if: steps.vinext-build.outputs.exit_code != '0'
        run: |
          echo "vinext production build failed; inspect vinext-build-log artifact."
          exit 1
