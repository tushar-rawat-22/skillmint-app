name: vinext compatibility proof

on:
  push:
    branches:
      - chore/issue-97-vinext-compat-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run pinned vinext compatibility check
        run: npx --yes vinext@1.0.0-beta.8 check
