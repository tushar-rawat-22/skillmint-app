name: Temporary Next lockfile generator

on:
  push:
    branches:
      - security/next-16-3-3

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched package files
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.3 eslint-config-next@16.3.3
      - name: Verify dependency state
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies.next !== '16.3.3' || p.devDependencies['eslint-config-next'] !== '16.3.3') process.exit(1); console.log({next:p.dependencies.next, eslintConfigNext:p.devDependencies['eslint-config-next'], sharpOverride:p.overrides?.next?.sharp})"
          npm audit --audit-level=high
      - name: Commit generated package files and remove helper
        run: |
          rm .github/workflows/tmp-next-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/tmp-next-lockfile.yml
          git commit -m "security: patch Next.js critical vulnerabilities"
          git push origin HEAD:security/next-16-3-3
