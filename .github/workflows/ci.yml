name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.17.0"
          test "$(npm --version)" = "11.13.0"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            git diff --check HEAD^1 HEAD
          elif git cat-file -p HEAD | grep -q '^parent '; then
            echo "Unable to resolve the first parent required for the whitespace check." >&2
            exit 1
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

      - name: Scan tracked secrets and local paths
        run: npm run check:secret-paths

      - name: Run launch-hardening fixtures
        run: npm run fixtures:launch-hardening

      - name: Run controlled-access fixtures
        run: npm run fixtures:controlled-access

      - name: Run public evidence demo fixtures
        run: npm run fixtures:public-evidence-demo

      - name: Run Resume Comparison fixtures
        run: npm run fixtures:resume-comparison

      - name: Run Resume Workspace Phase 1A fixtures
        run: npm run fixtures:resume-workspace-phase-1a

      - name: Run launch-hardening browser coverage
        run: npm run test:e2e:launch-hardening

      - name: Run controlled beta candidate loop
        run: npx playwright test e2e/controlled-beta-candidate-loop.spec.ts --project=chromium --workers=1 --retries=0

      - name: Run controlled-access browser coverage
        run: npm run test:e2e:controlled-access

      - name: Run public evidence demo browser coverage
        run: npm run test:e2e:public-evidence-demo

      - name: Run Proof Brief browser coverage
        run: npm run test:e2e:proof-brief

      - name: Run recruiter evidence browser coverage
        run: npm run test:e2e:recruiter-evidence

      - name: Run forgot-password coverage
        run: npm run test:e2e:forgot-password

      - name: Run existing password-recovery coverage
        run: npm run test:e2e:password-recovery

      - name: Run owner-isolation regression
        run: npm run test:e2e:owner-isolation

      - name: Run Resume Workspace regression
        run: npm run test:e2e:resume-workspace

      - name: Run Resume Comparison browser coverage
        run: npm run test:e2e:resume-comparison

      - name: Verify dependency tree
        run: npm ls --all

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify controlled-access client bundle boundary
        run: npm run check:controlled-access-client-bundles

      - name: Verify public evidence demo client bundle boundary
        run: npm run check:public-evidence-demo-client-bundles

      - name: Run offline contract fixtures
        run: |
          set -euo pipefail
          node scripts/account-data-export-fixtures.mjs
          node scripts/active-target-fixtures.mjs
          node scripts/block-5-2-8-integration-fixtures.mjs
          node scripts/browser-data-export-contract-fixtures.mjs
          node scripts/browser-data-export-engine-fixtures.mjs
          node scripts/confirm-dialog-accessibility-fixtures.mjs
          node scripts/data-controls-fixtures.mjs
          node scripts/feedback-reliability-fixtures.mjs
          node scripts/mission-path-fixtures.mjs
          node scripts/scoring-truth-fixtures.mjs
          node scripts/trust-center-reliability-fixtures.mjs
          node scripts/analytics-contract-fixtures.mjs
          node scripts/analytics-runtime-fixtures.mjs
          node scripts/analytics-dashboard-fixtures.mjs
          node scripts/analytics-acl-fixtures.mjs
          node scripts/block6-rollout-foundation-fixtures.mjs
          node scripts/proof-brief-fixtures.mjs
          node scripts/recruiter-evidence-fixtures.mjs
          node scripts/production-rollout-foundation-fixtures.mjs
          node scripts/production-pending-migration-integrity-fixtures.mjs
          node scripts/production-readonly-inventory-fixtures.mjs
          node scripts/smoke-production-fixtures.mjs
          node scripts/documentation-status-fixtures.mjs
